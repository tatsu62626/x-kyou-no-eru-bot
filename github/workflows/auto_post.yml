name: X auto post

on:
  schedule:
    # 10分おきに実行（UTC基準。GitHub側の負荷により数分〜十数分遅れることがある）
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # Actionsタブから手動実行したいときのため

permissions:
  contents: write   # content_queue.csvの更新をコミットするために必要

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post due tweets
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python post_due.py

      - name: Commit updated queue status
        run: |
          git config user.name "x-auto-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content_queue.csv
          git diff --cached --quiet || git commit -m "chore: update post queue status"
          git push
